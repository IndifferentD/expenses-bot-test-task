services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: expenses
      POSTGRES_USER: expenses
      POSTGRES_PASSWORD: expenses
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - expense-app-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expenses -d expenses"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: ./backend
      target: migrate
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: postgres://expenses:expenses@postgres:5432/expenses?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    command: ["up"]

  api:
    build:
      context: ./backend
      target: api
    environment:
      DATABASE_URL: postgres://expenses:expenses@postgres:5432/expenses?sslmode=disable
      HTTP_ADDR: ":8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_started

volumes:
  expense-app-postgres-data:
    name: expense-app-postgres-data
